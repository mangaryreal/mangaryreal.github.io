<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>Countdown</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --glass-bg: linear-gradient(145deg,rgba(255,255,255,0.14) 0%,rgba(255,255,255,0.06) 50%,rgba(255,255,255,0.10) 100%);
  --glass-border: rgba(255,255,255,0.22);
  --glass-shadow:
    0 1px 0 rgba(255,255,255,0.32) inset,
    1px 0 0 rgba(255,255,255,0.10) inset,
    0 -1px 0 rgba(0,0,0,0.18) inset,
    0 24px 80px rgba(0,0,0,0.45),
    0 0 120px rgba(120,60,230,0.18);
  --digit-size: clamp(3.2rem, 9vw, 7rem);
  --card-r: clamp(24px, 4vw, 40px);
  --accent: #a78bfa;
  --text: rgba(255,255,255,0.95);
  --muted: rgba(255,255,255,0.42);
}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  background:#07060f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  position:relative;
}

/* ─── Aurora Background ─── */
.aurora{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}
.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:0;
  animation:orbAppear 1.8s ease forwards, orbDrift linear infinite;
  will-change:transform;
}
.orb-a{
  width:min(700px,110vw);height:min(700px,110vw);
  background:radial-gradient(circle at 40% 40%,#7c3aed 0%,transparent 70%);
  top:-15%;left:-15%;
  animation-delay:0s,1.8s;
  animation-duration:1.8s,22s;
}
.orb-b{
  width:min(600px,95vw);height:min(600px,95vw);
  background:radial-gradient(circle at 60% 60%,#1d4ed8 0%,transparent 68%);
  bottom:-18%;right:-12%;
  animation-delay:0.3s,2.1s;
  animation-duration:1.8s,28s;
  animation-direction:normal,reverse;
}
.orb-c{
  width:min(500px,80vw);height:min(500px,80vw);
  background:radial-gradient(circle at 50% 50%,#be185d 0%,transparent 65%);
  top:30%;left:40%;
  transform:translate(-50%,-50%);
  animation-delay:0.6s,2.4s;
  animation-duration:1.8s,19s;
}
.orb-d{
  width:min(400px,70vw);height:min(400px,70vw);
  background:radial-gradient(circle at 50% 50%,#0e7490 0%,transparent 65%);
  top:60%;right:20%;
  animation-delay:0.9s,2.7s;
  animation-duration:1.8s,24s;
  animation-direction:normal,alternate;
}

@keyframes orbAppear{
  from{opacity:0}
  to{opacity:0.55}
}
@keyframes orbDrift{
  0%  {transform:translate(0,0) scale(1)}
  20% {transform:translate(28px,-38px) scale(1.04)}
  45% {transform:translate(-18px,24px) scale(0.97)}
  70% {transform:translate(22px,16px) scale(1.02)}
  100%{transform:translate(0,0) scale(1)}
}

/* ─── Main Layout ─── */
main{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(18px,3vh,32px);
  padding:20px;
  width:100%;
  animation:mainFadeIn 1.2s cubic-bezier(0.22,1,0.36,1) both;
  animation-delay:0.4s;
}
@keyframes mainFadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* ─── Event Title ─── */
.event-name{
  font-size:clamp(0.85rem,2.2vw,1.1rem);
  font-weight:500;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  cursor:pointer;
  padding:8px 20px;
  border-radius:40px;
  border:1px solid transparent;
  transition:color 0.25s, border-color 0.25s, background 0.25s;
  user-select:none;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:90vw;
}
.event-name:hover{
  color:var(--text);
  border-color:rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.05);
}

/* ─── Glass Card ─── */
.glass-card{
  background:var(--glass-bg);
  backdrop-filter:blur(60px) saturate(200%) brightness(1.08);
  -webkit-backdrop-filter:blur(60px) saturate(200%) brightness(1.08);
  border:1px solid var(--glass-border);
  border-radius:var(--card-r);
  padding:clamp(28px,5vw,56px) clamp(24px,6vw,72px);
  box-shadow:var(--glass-shadow);
  position:relative;
  overflow:hidden;
  transition:transform 0.18s ease, box-shadow 0.18s ease;
  transform-style:preserve-3d;
  cursor:default;
}
/* Top rim highlight */
.glass-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,0.5) 40%,rgba(255,255,255,0.5) 60%,transparent 95%);
  pointer-events:none;
  z-index:1;
}
/* Upper specular sweep */
.glass-card::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:55%;
  border-radius:var(--card-r) var(--card-r) 80% 80% / var(--card-r) var(--card-r) 50px 50px;
  background:linear-gradient(180deg,rgba(255,255,255,0.13) 0%,rgba(255,255,255,0.04) 55%,transparent 100%);
  pointer-events:none;
  z-index:1;
}

/* ─── Countdown Grid ─── */
.countdown{
  display:flex;
  align-items:center;
  gap:0;
  position:relative;
  z-index:2;
}

.unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(6px,1.2vw,14px);
  padding:0 clamp(10px,2.5vw,32px);
}

.digits{
  display:flex;
  gap:clamp(1px,0.4vw,5px);
  align-items:center;
}

/* ─── Digit Drum ─── */
.drum{
  position:relative;
  width:calc(var(--digit-size) * 0.62);
  height:var(--digit-size);
  overflow:hidden;
}
.drum-value{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--digit-size);
  font-weight:200;
  color:var(--text);
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.03em;
  will-change:transform,opacity,filter;
}
.drum-value.d-in{
  animation:drumIn 0.48s cubic-bezier(0.34,1.42,0.64,1) forwards;
}
.drum-value.d-out{
  animation:drumOut 0.32s cubic-bezier(0.4,0,0.8,0.6) forwards;
}
@keyframes drumIn{
  from{transform:translateY(38%) scale(0.82);opacity:0;filter:blur(6px)}
  to  {transform:translateY(0)   scale(1);   opacity:1;filter:blur(0)}
}
@keyframes drumOut{
  from{transform:translateY(0)    scale(1);   opacity:1;filter:blur(0)}
  to  {transform:translateY(-38%) scale(0.82);opacity:0;filter:blur(6px)}
}

/* ─── Unit Label ─── */
.unit-label{
  font-size:clamp(0.55rem,1.3vw,0.75rem);
  font-weight:600;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ─── Separator Dots ─── */
.sep{
  display:flex;
  flex-direction:column;
  gap:clamp(6px,1.5vw,12px);
  padding-bottom:calc(var(--digit-size) * 0.05 + clamp(6px,1.2vw,14px));
  flex-shrink:0;
}
.sep-dot{
  width:clamp(4px,0.8vw,7px);
  height:clamp(4px,0.8vw,7px);
  border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:dotPulse 1.8s ease-in-out infinite;
}
.sep-dot:nth-child(2){animation-delay:-0.9s}
@keyframes dotPulse{
  0%,100%{opacity:0.3;transform:scale(0.75)}
  50%{opacity:0.85;transform:scale(1.15)}
}

/* ─── Target Date Info ─── */
.target-info{
  font-size:clamp(0.72rem,1.8vw,0.88rem);
  color:var(--muted);
  letter-spacing:0.06em;
  cursor:pointer;
  padding:6px 16px;
  border-radius:40px;
  border:1px solid transparent;
  transition:color 0.25s, border-color 0.25s, background 0.25s;
  text-align:center;
}
.target-info:hover{
  color:var(--text);
  border-color:rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.05);
}

/* ─── Expired / Done State ─── */
.done-msg{
  font-size:clamp(1.4rem,4vw,2.2rem);
  font-weight:300;
  color:var(--text);
  letter-spacing:0.06em;
  text-align:center;
  line-height:1.4;
}
.done-sub{
  font-size:clamp(0.8rem,2vw,1rem);
  color:var(--muted);
  margin-top:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
}

/* ─── Settings Modal ─── */
.overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.35s, backdrop-filter 0.35s;
}
.overlay.open{
  opacity:1;
  pointer-events:all;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(16px);
}
.modal{
  background:linear-gradient(145deg,rgba(30,25,55,0.92),rgba(18,15,35,0.95));
  backdrop-filter:blur(50px) saturate(180%);
  -webkit-backdrop-filter:blur(50px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:28px;
  padding:clamp(24px,4vw,40px);
  width:min(420px,calc(100vw - 40px));
  box-shadow:0 1px 0 rgba(255,255,255,0.25) inset,0 32px 80px rgba(0,0,0,0.6);
  transform:translateY(24px) scale(0.94);
  transition:transform 0.42s cubic-bezier(0.34,1.4,0.64,1);
}
.overlay.open .modal{
  transform:translateY(0) scale(1);
}
.modal h2{
  font-size:1.25rem;
  font-weight:600;
  color:var(--text);
  margin-bottom:24px;
  letter-spacing:-0.01em;
}
.field{
  margin-bottom:18px;
}
.field label{
  display:block;
  font-size:0.72rem;
  font-weight:600;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}
.field input{
  width:100%;
  padding:12px 16px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  color:var(--text);
  font-size:0.95rem;
  font-family:inherit;
  transition:border-color 0.2s, background 0.2s;
  outline:none;
  -webkit-appearance:none;
  color-scheme:dark;
}
.field input:focus{
  border-color:rgba(167,139,250,0.6);
  background:rgba(255,255,255,0.10);
}
.field input::placeholder{color:var(--muted)}
.modal-actions{
  display:flex;
  gap:12px;
  margin-top:28px;
}
.btn{
  flex:1;
  padding:13px 20px;
  border:none;
  border-radius:14px;
  font-size:0.9rem;
  font-weight:600;
  cursor:pointer;
  letter-spacing:0.02em;
  transition:transform 0.15s, opacity 0.15s, box-shadow 0.15s;
  font-family:inherit;
}
.btn:active{transform:scale(0.96)}
.btn-cancel{
  background:rgba(255,255,255,0.09);
  color:var(--muted);
  border:1px solid rgba(255,255,255,0.12);
}
.btn-cancel:hover{background:rgba(255,255,255,0.13);color:var(--text)}
.btn-save{
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:#fff;
  box-shadow:0 4px 20px rgba(124,58,237,0.4);
}
.btn-save:hover{box-shadow:0 6px 28px rgba(124,58,237,0.55);transform:translateY(-1px)}

/* ─── Confetti particle (done state) ─── */
.confetti-ring{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  border-radius:var(--card-r);
  z-index:0;
}
.confetti-ring span{
  position:absolute;
  top:50%;left:50%;
  width:6px;height:6px;
  border-radius:50%;
  animation:confettiOut 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes confettiOut{
  from{transform:translate(-50%,-50%) scale(0);opacity:1}
  to{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0}
}

/* ─── Timer Controls ─── */
.timer-controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}
.timer-controls.hidden{display:none}
.timer-btn{
  padding:12px 28px;
  border:none;
  border-radius:40px;
  font-size:clamp(0.82rem,2vw,0.95rem);
  font-weight:600;
  cursor:pointer;
  letter-spacing:0.04em;
  font-family:inherit;
  transition:transform 0.15s, opacity 0.15s, box-shadow 0.15s, background 0.2s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.timer-btn:active{transform:scale(0.94)}
.timer-btn-start{
  background:linear-gradient(135deg,#059669,#10b981);
  color:#fff;
  box-shadow:0 4px 20px rgba(16,185,129,0.35);
}
.timer-btn-start:hover{box-shadow:0 6px 28px rgba(16,185,129,0.5)}
.timer-btn-pause{
  background:linear-gradient(135deg,#d97706,#f59e0b);
  color:#fff;
  box-shadow:0 4px 20px rgba(245,158,11,0.35);
}
.timer-btn-pause:hover{box-shadow:0 6px 28px rgba(245,158,11,0.5)}
.timer-btn-reset{
  background:rgba(255,255,255,0.09);
  color:var(--muted);
  border:1px solid rgba(255,255,255,0.12);
}
.timer-btn-reset:hover{background:rgba(255,255,255,0.13);color:var(--text)}

/* ─── Mode badge ─── */
.mode-badge{
  font-size:clamp(0.62rem,1.5vw,0.72rem);
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
  background:rgba(167,139,250,0.1);
  border:1px solid rgba(167,139,250,0.2);
  padding:4px 14px;
  border-radius:40px;
  cursor:pointer;
  transition:background 0.2s, border-color 0.2s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.mode-badge:hover{
  background:rgba(167,139,250,0.18);
  border-color:rgba(167,139,250,0.35);
}
.mode-badge.hidden{display:none}

/* ─── Duration Inputs ─── */
.duration-inputs{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
}
.duration-group{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.duration-group input{
  width:72px;
  text-align:center;
  padding:12px 8px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  color:var(--text);
  font-size:1.1rem;
  font-family:inherit;
  font-variant-numeric:tabular-nums;
  transition:border-color 0.2s, background 0.2s;
  outline:none;
  -webkit-appearance:none;
  color-scheme:dark;
}
.duration-group input:focus{
  border-color:rgba(167,139,250,0.6);
  background:rgba(255,255,255,0.10);
}
.duration-group small{
  font-size:0.65rem;
  font-weight:600;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
}
.duration-sep{
  font-size:1.4rem;
  color:var(--muted);
  font-weight:300;
  padding-bottom:18px;
}

/* ─── Mode Presets ─── */
.preset-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}
.preset-btn{
  padding:10px 12px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  color:var(--muted);
  font-size:0.78rem;
  font-weight:500;
  cursor:pointer;
  text-align:center;
  transition:background 0.2s, color 0.2s, border-color 0.2s;
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.preset-btn:hover, .preset-btn.active{
  background:rgba(167,139,250,0.15);
  color:var(--text);
  border-color:rgba(167,139,250,0.35);
}
.preset-btn .preset-icon{
  display:block;
  font-size:1.2rem;
  margin-bottom:2px;
}

/* ─── Modal Mode Tabs ─── */
.mode-tabs{
  display:flex;
  gap:6px;
  margin-bottom:20px;
  background:rgba(255,255,255,0.05);
  border-radius:14px;
  padding:4px;
}
.mode-tab{
  flex:1;
  padding:10px 8px;
  border:none;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-size:clamp(0.7rem,2vw,0.8rem);
  font-weight:600;
  cursor:pointer;
  transition:background 0.2s, color 0.2s;
  font-family:inherit;
  text-align:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.mode-tab.active{
  background:rgba(167,139,250,0.2);
  color:var(--text);
}
.mode-tab:hover:not(.active){
  background:rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.7);
}

.field.hidden{display:none}

/* ─── Sport Clock Theme ─── */
.sport-header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin-bottom:clamp(10px,2vw,18px);
  position:relative;
  z-index:2;
}
.sport-header.hidden{display:none}
.sport-title{
  font-size:clamp(0.72rem,1.8vw,0.88rem);
  font-weight:700;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--sport-accent, var(--accent));
}
.period-dots{
  display:flex;
  gap:8px;
  align-items:center;
}
.period-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  border:2px solid rgba(255,255,255,0.2);
  transition:background 0.3s, border-color 0.3s, transform 0.3s;
}
.period-dot.active{
  background:var(--sport-accent, var(--accent));
  border-color:var(--sport-accent, var(--accent));
  transform:scale(1.25);
  box-shadow:0 0 8px color-mix(in srgb, var(--sport-accent, var(--accent)) 50%, transparent);
}
.period-dot.done{
  background:rgba(255,255,255,0.35);
  border-color:rgba(255,255,255,0.45);
}
.period-label{
  font-size:clamp(0.62rem,1.4vw,0.75rem);
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.55);
}
.timer-btn-next{
  background:linear-gradient(135deg,var(--sport-accent, #7c3aed),color-mix(in srgb, var(--sport-accent, #7c3aed) 70%, #000));
  color:#fff;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.timer-btn-next:hover{box-shadow:0 6px 28px rgba(0,0,0,0.4);transform:translateY(-1px)}
.timer-btn-next.hidden{display:none}

/* ─── Responsive tweaks ─── */
@media(max-width:480px){
  .unit{padding:0 clamp(6px,2vw,16px)}
  .sep{gap:8px}
  .timer-btn{padding:10px 20px;font-size:0.82rem}
  .preset-grid{grid-template-columns:1fr 1fr}
  .modal{
    max-height:calc(100dvh - 40px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .mode-tabs{flex-wrap:wrap}
  .mode-tab{min-width:calc(33% - 6px)}
}
@media(max-width:360px){
  :root{--digit-size:2.6rem}
  .timer-btn{padding:8px 16px;font-size:0.78rem}
  .duration-group input{width:60px;padding:10px 6px;font-size:1rem}
  .preset-grid{grid-template-columns:1fr 1fr}
}

/* Ensure buttons & interactive elements are touch-friendly on mobile */
@media(hover:none) and (pointer:coarse){
  .event-name, .target-info, .mode-badge{
    min-height:44px;
    display:inline-flex;
    align-items:center;
  }
  .btn, .timer-btn, .preset-btn{
    min-height:44px;
  }
  .field input, .duration-group input{
    min-height:44px;
  }
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="orb orb-d"></div>
</div>

<main id="main">

<script>
/* ── Storage ── */
const STORE_KEY = 'countdown_v2';
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function save(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

/* ── Default target: New Year 2027 ── */
const DEFAULT_TARGET = new Date('2027-01-01T00:00:00').getTime();
const DEFAULT_NAME   = 'New Year 2027';

/* ── Sport Preset Definitions ── */
const SPORT_PRESETS = {
  exam_30:  { icon:'📝', sport:'Exam',       accent:'#7c3aed', periods:[{label:'Exam',dur:1800}] },
  exam_60:  { icon:'📝', sport:'Exam',       accent:'#7c3aed', periods:[{label:'Exam',dur:3600}] },
  exam_120: { icon:'📝', sport:'Exam',       accent:'#7c3aed', periods:[{label:'Exam',dur:7200}] },
  exam_180: { icon:'📝', sport:'Exam',       accent:'#7c3aed', periods:[{label:'Exam',dur:10800}] },
  football_half:  { icon:'⚽', sport:'Football',   accent:'#059669', periods:[{label:'1st Half',dur:2700}] },
  football_full:  { icon:'⚽', sport:'Football',   accent:'#059669', periods:[{label:'1st Half',dur:2700},{label:'2nd Half',dur:2700}] },
  football_extra: { icon:'⚽', sport:'Football',   accent:'#059669', periods:[{label:'Extra Time 1',dur:900},{label:'Extra Time 2',dur:900}] },
  basketball:     { icon:'🏀', sport:'Basketball', accent:'#ea580c', periods:[{label:'Q1',dur:720},{label:'Q2',dur:720},{label:'Q3',dur:720},{label:'Q4',dur:720}] },
  hockey:         { icon:'🏒', sport:'Hockey',     accent:'#0ea5e9', periods:[{label:'1st Period',dur:1200},{label:'2nd Period',dur:1200},{label:'3rd Period',dur:1200}] },
  rugby:          { icon:'🏉', sport:'Rugby',      accent:'#15803d', periods:[{label:'1st Half',dur:2400},{label:'2nd Half',dur:2400}] },
  boxing:         { icon:'🥊', sport:'Boxing',     accent:'#dc2626', periods:[{label:'Round',dur:300}] },
  quick:          { icon:'⏲️', sport:'Timer',      accent:'#7c3aed', periods:[{label:'Timer',dur:600}] },
};

let state = {
  name: DEFAULT_NAME,
  target: DEFAULT_TARGET,
  mode: 'countdown',       // 'countdown' | 'timer'
  duration: 0,             // total seconds for current period
  timerStatus: 'idle',     // 'idle' | 'running' | 'paused'
  remaining: 0,            // remaining seconds when paused
  preset: '',              // preset key from SPORT_PRESETS
  period: 0,               // current period index (0-based)
  ...load()
};

/* ── Digit Drums ── */
const drumState = {};

function getDrum(containerId, numDigits) {
  const container = document.getElementById(containerId);
  if (!container) return null;
  if (!drumState[containerId]) {
    drumState[containerId] = { container, drums: [], prev: [] };
    for (let i = 0; i < numDigits; i++) {
      const drum = document.createElement('div');
      drum.className = 'drum';
      container.appendChild(drum);
      drumState[containerId].drums.push(drum);
      drumState[containerId].prev.push(-1);
    }
  }
  return drumState[containerId];
}

function setDigits(id, value, digits) {
  const padded = String(value).padStart(digits, '0');
  const drumData = getDrum(id, digits);
  if (!drumData) return;
  const { drums, prev } = drumData;
  for (let i = 0; i < digits; i++) {
    const ch = padded[i];
    if (ch === String(prev[i])) continue;
    prev[i] = ch;
    const drum = drums[i];
    const existing = drum.querySelector('.drum-value:not(.d-out)');
    if (existing) {
      existing.classList.remove('d-in');
      existing.classList.add('d-out');
      existing.addEventListener('animationend', () => existing.remove(), { once: true });
    }
    const el = document.createElement('div');
    el.className = 'drum-value d-in';
    el.textContent = ch;
    drum.appendChild(el);
  }
}

/* ── Format helpers ── */
function fmt(dt) {
  return dt.toLocaleString('en-US', {
    weekday:'short', month:'short', day:'numeric',
    year:'numeric', hour:'numeric', minute:'2-digit', hour12:true
  });
}

function fmtDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const parts = [];
  if (h > 0) parts.push(h + 'h');
  if (m > 0 || h > 0) parts.push(m + 'm');
  parts.push(s + 's');
  return parts.join(' ');
}

/* ── Layout helpers ── */
function getActivePreset() {
  return state.preset ? SPORT_PRESETS[state.preset] || null : null;
}

function getTimerLayout() {
  if (state.mode === 'countdown') return 'days';
  const p = getActivePreset();
  if (p) {
    const cur = p.periods[state.period || 0];
    if (cur && cur.dur < 3600) return 'ms';
  }
  if (state.duration < 3600) return 'ms';
  return 'hms';
}

/* ── Layout: build countdown display ── */
function buildCountdownMarkup(layout) {
  const cd = document.getElementById('countdown');
  if (layout === 'days') {
    cd.innerHTML = `
      <div class="unit"><div class="digits" id="dDays"></div><div class="unit-label">Days</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dHours"></div><div class="unit-label">Hours</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dMinutes"></div><div class="unit-label">Minutes</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dSeconds"></div><div class="unit-label">Seconds</div></div>`;
  } else if (layout === 'hms') {
    cd.innerHTML = `
      <div class="unit"><div class="digits" id="dHours"></div><div class="unit-label">Hours</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dMinutes"></div><div class="unit-label">Minutes</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dSeconds"></div><div class="unit-label">Seconds</div></div>`;
  } else {
    cd.innerHTML = `
      <div class="unit"><div class="digits" id="dMinutes"></div><div class="unit-label">Minutes</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dSeconds"></div><div class="unit-label">Seconds</div></div>`;
  }
  ['dDays','dHours','dMinutes','dSeconds'].forEach(id => delete drumState[id]);
}

/* ── Sport Header ── */
function updateSportHeader() {
  const header = document.getElementById('sportHeader');
  const glassCard = document.getElementById('glassCard');
  const preset = getActivePreset();

  if (!preset || state.mode !== 'timer') {
    header.classList.add('hidden');
    header.innerHTML = '';
    glassCard.style.removeProperty('--sport-accent');
    return;
  }

  glassCard.style.setProperty('--sport-accent', preset.accent);

  const periods = preset.periods;
  const currentPeriod = state.period || 0;

  let dotsHtml = '';
  if (periods.length > 1) {
    dotsHtml = '<div class="period-dots">';
    for (let i = 0; i < periods.length; i++) {
      const cls = i < currentPeriod ? 'done' : i === currentPeriod ? 'active' : '';
      dotsHtml += '<div class="period-dot ' + cls + '"></div>';
    }
    dotsHtml += '</div>';
  }

  const periodLabel = periods[currentPeriod] ? periods[currentPeriod].label : '';

  header.innerHTML =
    '<div class="sport-title">' + escHtml(preset.icon) + ' ' + escHtml(preset.sport) + '</div>' +
    dotsHtml +
    '<div class="period-label">' + escHtml(periodLabel) + '</div>';
  header.classList.remove('hidden');
}

/* ── Tick ── */
let lastSeconds = -1;
let doneFired = false;

function tick() {
  if (state.mode === 'timer') {
    tickTimer();
  } else {
    tickCountdown();
  }
}

function tickCountdown() {
  const now  = Date.now();
  const diff = state.target - now;

  if (diff <= 0) {
    if (!doneFired) {
      doneFired = true;
      showDone();
    }
    return;
  }

  const totalSec = Math.floor(diff / 1000);
  if (totalSec === lastSeconds) return;
  lastSeconds = totalSec;

  const days    = Math.floor(totalSec / 86400);
  const hours   = Math.floor((totalSec % 86400) / 3600);
  const minutes = Math.floor((totalSec % 3600) / 60);
  const seconds = totalSec % 60;

  const dayDigits = days >= 100 ? 3 : 2;
  setDigits('dDays',    days,    dayDigits);
  setDigits('dHours',   hours,   2);
  setDigits('dMinutes', minutes, 2);
  setDigits('dSeconds', seconds, 2);
}

function tickTimer() {
  let remaining;

  if (state.timerStatus === 'idle') {
    remaining = state.duration;
  } else if (state.timerStatus === 'paused') {
    remaining = state.remaining;
  } else if (state.timerStatus === 'running') {
    const now  = Date.now();
    const diff = state.target - now;
    if (diff <= 0) {
      remaining = 0;
      if (!doneFired) {
        doneFired = true;
        state.timerStatus = 'idle';
        state.remaining = 0;
        save(state);
        updateTimerButtons();

        const preset = getActivePreset();
        if (preset && preset.periods.length > 1 && (state.period || 0) < preset.periods.length - 1) {
          showPeriodDone();
        } else {
          showDone();
        }
      }
      return;
    }
    remaining = Math.floor(diff / 1000);
  }

  if (remaining === lastSeconds) return;
  lastSeconds = remaining;

  const layout = getTimerLayout();
  if (layout === 'ms') {
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;
    setDigits('dMinutes', minutes, 2);
    setDigits('dSeconds', seconds, 2);
  } else {
    const hours   = Math.floor(remaining / 3600);
    const minutes = Math.floor((remaining % 3600) / 60);
    const seconds = remaining % 60;
    setDigits('dHours',   hours,   2);
    setDigits('dMinutes', minutes, 2);
    setDigits('dSeconds', seconds, 2);
  }
}

function showDone() {
  const glassCard = document.getElementById('glassCard');
  const cd   = document.getElementById('countdown');
  cd.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px">' +
    '<div class="done-msg">🎉&nbsp; Time\u2019s up!</div>' +
    '<div class="done-sub">' + escHtml(state.name) + '</div></div>';
  burstConfetti(glassCard);
}

function showPeriodDone() {
  const glassCard = document.getElementById('glassCard');
  const cd   = document.getElementById('countdown');
  const preset = getActivePreset();
  const periodLabel = preset ? preset.periods[state.period || 0].label : '';
  cd.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px">' +
    '<div class="done-msg">⏱&nbsp; ' + escHtml(periodLabel) + ' Complete</div>' +
    '<div class="done-sub">Press Next to continue</div></div>';
  burstConfetti(glassCard);
}

function burstConfetti(container) {
  const ring = document.createElement('div');
  ring.className = 'confetti-ring';
  const colors = ['#a78bfa','#60a5fa','#f472b6','#34d399','#fbbf24'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    const angle = (i / 28) * 360;
    const dist  = 60 + Math.random() * 80;
    s.style.cssText =
      'background:' + colors[i % colors.length] + ';' +
      '--tx:' + (Math.cos(angle * Math.PI/180) * dist) + 'px;' +
      '--ty:' + (Math.sin(angle * Math.PI/180) * dist) + 'px;' +
      'animation-delay:' + (Math.random()*0.3) + 's';
    ring.appendChild(s);
  }
  container.appendChild(ring);
}

/* ── Timer controls ── */
const timerControls = document.getElementById('timerControls');
const btnStart      = document.getElementById('btnStart');
const btnPause      = document.getElementById('btnPause');
const btnReset      = document.getElementById('btnReset');
const btnNext       = document.getElementById('btnNext');

function startTimer() {
  let sec = (state.timerStatus === 'paused' && state.remaining > 0)
    ? state.remaining
    : state.duration;
  if (sec <= 0) return;
  state.target = Date.now() + sec * 1000;
  state.timerStatus = 'running';
  state.remaining = sec;
  doneFired = false;
  lastSeconds = -1;
  save(state);
  updateTimerButtons();
  restoreCountdownIfDone();
  tick();
}

function pauseTimer() {
  if (state.timerStatus !== 'running') return;
  const diff = state.target - Date.now();
  state.remaining = Math.max(0, Math.floor(diff / 1000));
  state.timerStatus = 'paused';
  save(state);
  updateTimerButtons();
}

function resetTimer() {
  state.timerStatus = 'idle';
  state.remaining = state.duration;
  doneFired = false;
  lastSeconds = -1;
  save(state);
  updateTimerButtons();
  restoreCountdownIfDone();
  tick();
}

function nextPeriod() {
  const preset = getActivePreset();
  if (!preset) return;
  const periods = preset.periods;
  const next = (state.period || 0) + 1;
  if (next >= periods.length) return;

  state.period = next;
  state.duration = periods[next].dur;
  state.remaining = periods[next].dur;
  state.timerStatus = 'idle';
  doneFired = false;
  lastSeconds = -1;
  save(state);

  resetDrums();
  buildCountdownMarkup(getTimerLayout());
  removeConfetti();
  updateSportHeader();
  updateTimerButtons();
  updateLabel();
  tick();
}

function updateTimerButtons() {
  if (state.mode !== 'timer') {
    timerControls.classList.add('hidden');
    btnNext.classList.add('hidden');
    return;
  }
  timerControls.classList.remove('hidden');
  if (state.timerStatus === 'running') {
    btnStart.style.display = 'none';
    btnPause.style.display = '';
  } else {
    btnStart.style.display = '';
    btnPause.style.display = 'none';
    btnStart.textContent = state.timerStatus === 'paused' ? '▶ Resume' : '▶ Start';
  }

  // Next period button
  const preset = getActivePreset();
  if (preset && preset.periods.length > 1 && (state.period || 0) < preset.periods.length - 1) {
    btnNext.classList.remove('hidden');
    const nextLabel = preset.periods[(state.period || 0) + 1].label;
    btnNext.textContent = '▶ Next: ' + nextLabel;
    btnNext.style.setProperty('--sport-accent', preset.accent);
  } else {
    btnNext.classList.add('hidden');
  }
}

btnStart.addEventListener('click', startTimer);
btnPause.addEventListener('click', pauseTimer);
btnReset.addEventListener('click', resetTimer);
btnNext.addEventListener('click', nextPeriod);

/* ── Helper: reset drum state ── */
function resetDrums() {
  Object.keys(drumState).forEach(k => {
    drumState[k].drums.forEach(d => d.innerHTML = '');
    drumState[k].prev = drumState[k].prev.map(() => -1);
  });
}

/* ── Helper: remove confetti ── */
function removeConfetti() {
  const ring = document.querySelector('.confetti-ring');
  if (ring) ring.remove();
}

/* ── Restore countdown markup if in done state ── */
function restoreCountdownIfDone() {
  const cd = document.getElementById('countdown');
  if (!cd.querySelector('.unit')) {
    buildCountdownMarkup(getTimerLayout());
    removeConfetti();
  }
}

/* ── Target info label ── */
function updateLabel() {
  const info    = document.getElementById('targetInfo');
  const name    = document.getElementById('eventName');
  const badge   = document.getElementById('modeBadge');

  name.textContent = state.name;

  if (state.mode === 'countdown') {
    info.textContent = fmt(new Date(state.target));
    info.classList.remove('hidden');
    badge.classList.add('hidden');
  } else {
    const preset = getActivePreset();
    if (preset && preset.periods.length > 1) {
      const totalDur = preset.periods.reduce(function(sum, p) { return sum + p.dur; }, 0);
      info.textContent = 'Total: ' + fmtDuration(totalDur) + ' · Period: ' + fmtDuration(state.duration);
    } else {
      info.textContent = 'Duration: ' + fmtDuration(state.duration);
    }
    info.classList.remove('hidden');
    badge.classList.remove('hidden');
    if (preset) {
      badge.textContent = preset.icon + ' ' + preset.sport + ' Mode';
    } else {
      badge.textContent = '⏱ Timer Mode';
    }
  }
}

/* ── Card tilt / parallax ── */
const card = document.getElementById('glassCard');
let tiltRAF = null;
card.addEventListener('mousemove', e => {
  cancelAnimationFrame(tiltRAF);
  tiltRAF = requestAnimationFrame(() => {
    const r = card.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  - 0.5) * 2;
    const y = ((e.clientY - r.top)  / r.height - 0.5) * 2;
    card.style.transform = `rotateY(${x * 5}deg) rotateX(${-y * 5}deg) translateZ(0)`;
  });
});
card.addEventListener('mouseleave', () => {
  cancelAnimationFrame(tiltRAF);
  card.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1)';
  card.style.transform  = '';
  setTimeout(() => { card.style.transition = ''; }, 620);
});

/* ── Modal ── */
const overlay    = document.getElementById('overlay');
const nameInput  = document.getElementById('nameInput');
const dateInput  = document.getElementById('dateInput');
const btnSave    = document.getElementById('btnSave');
const btnCancel  = document.getElementById('btnCancel');
const modeTabs   = document.querySelectorAll('.mode-tab');
const fieldDate  = document.getElementById('fieldDate');
const fieldDur   = document.getElementById('fieldDuration');
const fieldPre   = document.getElementById('fieldPresets');
const durH       = document.getElementById('durHours');
const durM       = document.getElementById('durMinutes');
const durS       = document.getElementById('durSeconds');

let modalMode = 'countdown';
let selectedPresetDuration = 0;
let selectedPresetName = '';
let selectedPresetKey = '';

function setModalMode(mode) {
  modalMode = mode;
  modeTabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  fieldDate.classList.toggle('hidden', mode !== 'countdown');
  fieldDur.classList.toggle('hidden',  mode !== 'timer');
  fieldPre.classList.toggle('hidden',  mode !== 'preset');

  // Show/hide name field placeholder based on mode
  if (mode === 'countdown') {
    nameInput.placeholder = 'New Year 2027';
  } else if (mode === 'timer') {
    nameInput.placeholder = 'My Timer';
  } else {
    nameInput.placeholder = 'Event Name (auto-filled)';
  }
}

modeTabs.forEach(tab => {
  tab.addEventListener('click', () => setModalMode(tab.dataset.mode));
});

// Preset buttons
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedPresetDuration = parseInt(btn.dataset.duration, 10);
    selectedPresetName = btn.dataset.name;
    selectedPresetKey = btn.dataset.preset || '';
    nameInput.value = selectedPresetName;
  });
});

function openModal() {
  if (state.mode === 'countdown') {
    setModalMode('countdown');
  } else {
    setModalMode('timer');
  }
  nameInput.value = state.name;

  // Populate date
  const d = new Date(state.target);
  const pad = n => String(n).padStart(2,'0');
  dateInput.value =
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` +
    `T${pad(d.getHours())}:${pad(d.getMinutes())}`;

  // Populate duration
  const dur = state.duration || 0;
  durH.value = Math.floor(dur / 3600);
  durM.value = Math.floor((dur % 3600) / 60);
  durS.value = dur % 60;

  // Reset preset selection
  selectedPresetDuration = 0;
  selectedPresetName = '';
  selectedPresetKey = '';
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));

  overlay.classList.add('open');
  setTimeout(() => nameInput.focus(), 60);
}

function closeModal() {
  overlay.classList.remove('open');
}

function applySettings() {
  const name = nameInput.value.trim() || DEFAULT_NAME;

  if (modalMode === 'countdown') {
    const dt     = new Date(dateInput.value);
    const target = isNaN(dt.getTime()) ? DEFAULT_TARGET : dt.getTime();
    state = { name, target, mode: 'countdown', duration: 0, timerStatus: 'idle', remaining: 0, preset: '', period: 0 };
  } else if (modalMode === 'timer') {
    const h = Math.max(0, parseInt(durH.value, 10) || 0);
    const m = Math.max(0, Math.min(59, parseInt(durM.value, 10) || 0));
    const s = Math.max(0, Math.min(59, parseInt(durS.value, 10) || 0));
    const totalSec = h * 3600 + m * 60 + s;
    state = { name, target: 0, mode: 'timer', duration: totalSec, timerStatus: 'idle', remaining: totalSec, preset: '', period: 0 };
  } else if (modalMode === 'preset') {
    const presetKey = selectedPresetKey;
    const presetCfg = SPORT_PRESETS[presetKey];
    if (presetCfg) {
      const firstPeriod = presetCfg.periods[0];
      const pName = name !== DEFAULT_NAME ? name : (selectedPresetName || presetCfg.sport);
      state = { name: pName, target: 0, mode: 'timer', duration: firstPeriod.dur, timerStatus: 'idle', remaining: firstPeriod.dur, preset: presetKey, period: 0 };
    } else {
      const dur = selectedPresetDuration || 600;
      const pName = name !== DEFAULT_NAME ? name : (selectedPresetName || 'Timer');
      state = { name: pName, target: 0, mode: 'timer', duration: dur, timerStatus: 'idle', remaining: dur, preset: '', period: 0 };
    }
  }

  save(state);
  doneFired = false;
  lastSeconds = -1;

  resetDrums();
  buildCountdownMarkup(getTimerLayout());
  removeConfetti();
  updateSportHeader();
  updateLabel();
  updateTimerButtons();
  closeModal();
  tick();
}

document.getElementById('eventName').addEventListener('click', openModal);
document.getElementById('targetInfo').addEventListener('click', openModal);
document.getElementById('modeBadge').addEventListener('click', openModal);
document.getElementById('eventName').addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && openModal());
document.getElementById('targetInfo').addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && openModal());
document.getElementById('modeBadge').addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && openModal());
btnSave.addEventListener('click', applySettings);
btnCancel.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── XSS helper ── */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ── Init ── */
buildCountdownMarkup(getTimerLayout());
updateSportHeader();
updateLabel();
updateTimerButtons();
tick();
setInterval(tick, 200);
</script>
</body>
</html>
