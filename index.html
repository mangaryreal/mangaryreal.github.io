<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>Countdown</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --glass-bg: linear-gradient(145deg,rgba(255,255,255,0.14) 0%,rgba(255,255,255,0.06) 50%,rgba(255,255,255,0.10) 100%);
  --glass-border: rgba(255,255,255,0.22);
  --glass-shadow:
    0 1px 0 rgba(255,255,255,0.32) inset,
    1px 0 0 rgba(255,255,255,0.10) inset,
    0 -1px 0 rgba(0,0,0,0.18) inset,
    0 24px 80px rgba(0,0,0,0.45),
    0 0 120px rgba(120,60,230,0.18);
  --digit-size: clamp(3.2rem, 9vw, 7rem);
  --card-r: clamp(24px, 4vw, 40px);
  --accent: #a78bfa;
  --text: rgba(255,255,255,0.95);
  --muted: rgba(255,255,255,0.42);
}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  background:#07060f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  position:relative;
}

/* ─── Aurora Background ─── */
.aurora{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}
.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:0;
  animation:orbAppear 1.8s ease forwards, orbDrift linear infinite;
  will-change:transform;
}
.orb-a{
  width:min(700px,110vw);height:min(700px,110vw);
  background:radial-gradient(circle at 40% 40%,#7c3aed 0%,transparent 70%);
  top:-15%;left:-15%;
  animation-delay:0s,1.8s;
  animation-duration:1.8s,22s;
}
.orb-b{
  width:min(600px,95vw);height:min(600px,95vw);
  background:radial-gradient(circle at 60% 60%,#1d4ed8 0%,transparent 68%);
  bottom:-18%;right:-12%;
  animation-delay:0.3s,2.1s;
  animation-duration:1.8s,28s;
  animation-direction:normal,reverse;
}
.orb-c{
  width:min(500px,80vw);height:min(500px,80vw);
  background:radial-gradient(circle at 50% 50%,#be185d 0%,transparent 65%);
  top:30%;left:40%;
  transform:translate(-50%,-50%);
  animation-delay:0.6s,2.4s;
  animation-duration:1.8s,19s;
}
.orb-d{
  width:min(400px,70vw);height:min(400px,70vw);
  background:radial-gradient(circle at 50% 50%,#0e7490 0%,transparent 65%);
  top:60%;right:20%;
  animation-delay:0.9s,2.7s;
  animation-duration:1.8s,24s;
  animation-direction:normal,alternate;
}

@keyframes orbAppear{
  from{opacity:0}
  to{opacity:0.55}
}
@keyframes orbDrift{
  0%  {transform:translate(0,0) scale(1)}
  20% {transform:translate(28px,-38px) scale(1.04)}
  45% {transform:translate(-18px,24px) scale(0.97)}
  70% {transform:translate(22px,16px) scale(1.02)}
  100%{transform:translate(0,0) scale(1)}
}

/* ─── Main Layout ─── */
main{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(18px,3vh,32px);
  padding:20px;
  width:100%;
  animation:mainFadeIn 1.2s cubic-bezier(0.22,1,0.36,1) both;
  animation-delay:0.4s;
}
@keyframes mainFadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* ─── Event Title ─── */
.event-name{
  font-size:clamp(0.85rem,2.2vw,1.1rem);
  font-weight:500;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  cursor:pointer;
  padding:8px 20px;
  border-radius:40px;
  border:1px solid transparent;
  transition:color 0.25s, border-color 0.25s, background 0.25s;
  user-select:none;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:90vw;
}
.event-name:hover{
  color:var(--text);
  border-color:rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.05);
}

/* ─── Glass Card ─── */
.glass-card{
  background:var(--glass-bg);
  backdrop-filter:blur(60px) saturate(200%) brightness(1.08);
  -webkit-backdrop-filter:blur(60px) saturate(200%) brightness(1.08);
  border:1px solid var(--glass-border);
  border-radius:var(--card-r);
  padding:clamp(28px,5vw,56px) clamp(24px,6vw,72px);
  box-shadow:var(--glass-shadow);
  position:relative;
  overflow:hidden;
  transition:transform 0.18s ease, box-shadow 0.18s ease;
  transform-style:preserve-3d;
  cursor:default;
}
/* Top rim highlight */
.glass-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,0.5) 40%,rgba(255,255,255,0.5) 60%,transparent 95%);
  pointer-events:none;
  z-index:1;
}
/* Upper specular sweep */
.glass-card::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:55%;
  border-radius:var(--card-r) var(--card-r) 80% 80% / var(--card-r) var(--card-r) 50px 50px;
  background:linear-gradient(180deg,rgba(255,255,255,0.13) 0%,rgba(255,255,255,0.04) 55%,transparent 100%);
  pointer-events:none;
  z-index:1;
}

/* ─── Countdown Grid ─── */
.countdown{
  display:flex;
  align-items:center;
  gap:0;
  position:relative;
  z-index:2;
}

.unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(6px,1.2vw,14px);
  padding:0 clamp(10px,2.5vw,32px);
}

.digits{
  display:flex;
  gap:clamp(1px,0.4vw,5px);
  align-items:center;
}

/* ─── Digit Drum ─── */
.drum{
  position:relative;
  width:calc(var(--digit-size) * 0.62);
  height:var(--digit-size);
  overflow:hidden;
}
.drum-value{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--digit-size);
  font-weight:200;
  color:var(--text);
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.03em;
  will-change:transform,opacity,filter;
}
.drum-value.d-in{
  animation:drumIn 0.48s cubic-bezier(0.34,1.42,0.64,1) forwards;
}
.drum-value.d-out{
  animation:drumOut 0.32s cubic-bezier(0.4,0,0.8,0.6) forwards;
}
@keyframes drumIn{
  from{transform:translateY(38%) scale(0.82);opacity:0;filter:blur(6px)}
  to  {transform:translateY(0)   scale(1);   opacity:1;filter:blur(0)}
}
@keyframes drumOut{
  from{transform:translateY(0)    scale(1);   opacity:1;filter:blur(0)}
  to  {transform:translateY(-38%) scale(0.82);opacity:0;filter:blur(6px)}
}

/* ─── Unit Label ─── */
.unit-label{
  font-size:clamp(0.55rem,1.3vw,0.75rem);
  font-weight:600;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ─── Separator Dots ─── */
.sep{
  display:flex;
  flex-direction:column;
  gap:clamp(6px,1.5vw,12px);
  padding-bottom:calc(var(--digit-size) * 0.05 + clamp(6px,1.2vw,14px));
  flex-shrink:0;
}
.sep-dot{
  width:clamp(4px,0.8vw,7px);
  height:clamp(4px,0.8vw,7px);
  border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:dotPulse 1.8s ease-in-out infinite;
}
.sep-dot:nth-child(2){animation-delay:-0.9s}
@keyframes dotPulse{
  0%,100%{opacity:0.3;transform:scale(0.75)}
  50%{opacity:0.85;transform:scale(1.15)}
}

/* ─── Target Date Info ─── */
.target-info{
  font-size:clamp(0.72rem,1.8vw,0.88rem);
  color:var(--muted);
  letter-spacing:0.06em;
  cursor:pointer;
  padding:6px 16px;
  border-radius:40px;
  border:1px solid transparent;
  transition:color 0.25s, border-color 0.25s, background 0.25s;
  text-align:center;
}
.target-info:hover{
  color:var(--text);
  border-color:rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.05);
}

/* ─── Expired / Done State ─── */
.done-msg{
  font-size:clamp(1.4rem,4vw,2.2rem);
  font-weight:300;
  color:var(--text);
  letter-spacing:0.06em;
  text-align:center;
  line-height:1.4;
}
.done-sub{
  font-size:clamp(0.8rem,2vw,1rem);
  color:var(--muted);
  margin-top:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
}

/* ─── Settings Modal ─── */
.overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.35s, backdrop-filter 0.35s;
}
.overlay.open{
  opacity:1;
  pointer-events:all;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(16px);
}
.modal{
  background:linear-gradient(145deg,rgba(30,25,55,0.92),rgba(18,15,35,0.95));
  backdrop-filter:blur(50px) saturate(180%);
  -webkit-backdrop-filter:blur(50px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:28px;
  padding:clamp(24px,4vw,40px);
  width:min(420px,calc(100vw - 40px));
  box-shadow:0 1px 0 rgba(255,255,255,0.25) inset,0 32px 80px rgba(0,0,0,0.6);
  transform:translateY(24px) scale(0.94);
  transition:transform 0.42s cubic-bezier(0.34,1.4,0.64,1);
}
.overlay.open .modal{
  transform:translateY(0) scale(1);
}
.modal h2{
  font-size:1.25rem;
  font-weight:600;
  color:var(--text);
  margin-bottom:24px;
  letter-spacing:-0.01em;
}
.field{
  margin-bottom:18px;
}
.field label{
  display:block;
  font-size:0.72rem;
  font-weight:600;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}
.field input{
  width:100%;
  padding:12px 16px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  color:var(--text);
  font-size:0.95rem;
  font-family:inherit;
  transition:border-color 0.2s, background 0.2s;
  outline:none;
  -webkit-appearance:none;
  color-scheme:dark;
}
.field input:focus{
  border-color:rgba(167,139,250,0.6);
  background:rgba(255,255,255,0.10);
}
.field input::placeholder{color:var(--muted)}
.modal-actions{
  display:flex;
  gap:12px;
  margin-top:28px;
}
.btn{
  flex:1;
  padding:13px 20px;
  border:none;
  border-radius:14px;
  font-size:0.9rem;
  font-weight:600;
  cursor:pointer;
  letter-spacing:0.02em;
  transition:transform 0.15s, opacity 0.15s, box-shadow 0.15s;
  font-family:inherit;
}
.btn:active{transform:scale(0.96)}
.btn-cancel{
  background:rgba(255,255,255,0.09);
  color:var(--muted);
  border:1px solid rgba(255,255,255,0.12);
}
.btn-cancel:hover{background:rgba(255,255,255,0.13);color:var(--text)}
.btn-save{
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:#fff;
  box-shadow:0 4px 20px rgba(124,58,237,0.4);
}
.btn-save:hover{box-shadow:0 6px 28px rgba(124,58,237,0.55);transform:translateY(-1px)}

/* ─── Confetti particle (done state) ─── */
.confetti-ring{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  border-radius:var(--card-r);
  z-index:0;
}
.confetti-ring span{
  position:absolute;
  top:50%;left:50%;
  width:6px;height:6px;
  border-radius:50%;
  animation:confettiOut 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes confettiOut{
  from{transform:translate(-50%,-50%) scale(0);opacity:1}
  to{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0}
}

/* ─── Responsive tweaks ─── */
@media(max-width:480px){
  .unit{padding:0 clamp(6px,2vw,16px)}
  .sep{gap:8px}
}
@media(max-width:360px){
  :root{--digit-size:2.6rem}
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="orb orb-d"></div>
</div>

<main id="main">
  <h1 class="event-name" id="eventName" role="button" tabindex="0" aria-label="Click to edit event name">
    New Year 2027
  </h1>

  <div class="glass-card" id="glassCard">
    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="digits" id="dDays"></div>
        <div class="unit-label">Days</div>
      </div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit">
        <div class="digits" id="dHours"></div>
        <div class="unit-label">Hours</div>
      </div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit">
        <div class="digits" id="dMinutes"></div>
        <div class="unit-label">Minutes</div>
      </div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit">
        <div class="digits" id="dSeconds"></div>
        <div class="unit-label">Seconds</div>
      </div>
    </div>
  </div>

  <p class="target-info" id="targetInfo" role="button" tabindex="0" aria-label="Click to edit target date"></p>
</main>

<!-- Settings Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Countdown settings">
  <div class="modal" id="modal">
    <h2>Set Countdown</h2>
    <div class="field">
      <label for="nameInput">Event Name</label>
      <input type="text" id="nameInput" maxlength="60" placeholder="New Year 2027" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="dateInput">Target Date &amp; Time</label>
      <input type="datetime-local" id="dateInput">
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn btn-save" id="btnSave">Save</button>
    </div>
  </div>
</div>

<script>
/* ── Storage ── */
const STORE_KEY = 'countdown_v2';
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function save(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

/* ── Default target: New Year 2027 ── */
const DEFAULT_TARGET = new Date('2027-01-01T00:00:00').getTime();
const DEFAULT_NAME   = 'New Year 2027';

let state = { name: DEFAULT_NAME, target: DEFAULT_TARGET, ...load() };

/* ── Digit Drums ── */
const drumState = {};

function getDrum(containerId, numDigits) {
  const container = document.getElementById(containerId);
  if (!drumState[containerId]) {
    drumState[containerId] = { container, drums: [], prev: [] };
    for (let i = 0; i < numDigits; i++) {
      const drum = document.createElement('div');
      drum.className = 'drum';
      container.appendChild(drum);
      drumState[containerId].drums.push(drum);
      drumState[containerId].prev.push(-1);
    }
  }
  return drumState[containerId];
}

function setDigits(id, value, digits) {
  const padded = String(value).padStart(digits, '0');
  const { drums, prev } = getDrum(id, digits);
  for (let i = 0; i < digits; i++) {
    const ch = padded[i];
    if (ch === String(prev[i])) continue;
    prev[i] = ch;
    const drum = drums[i];
    // Animate out existing
    const existing = drum.querySelector('.drum-value:not(.d-out)');
    if (existing) {
      existing.classList.remove('d-in');
      existing.classList.add('d-out');
      existing.addEventListener('animationend', () => existing.remove(), { once: true });
    }
    // Create new
    const el = document.createElement('div');
    el.className = 'drum-value d-in';
    el.textContent = ch;
    drum.appendChild(el);
  }
}

/* ── Format helpers ── */
function fmt(dt) {
  return dt.toLocaleString('en-US', {
    weekday:'short', month:'short', day:'numeric',
    year:'numeric', hour:'numeric', minute:'2-digit', hour12:true
  });
}

/* ── Tick ── */
let lastSeconds = -1;
let doneFired = false;

function tick() {
  const now    = Date.now();
  const diff   = state.target - now;

  if (diff <= 0) {
    if (!doneFired) {
      doneFired = true;
      showDone();
    }
    return;
  }

  const totalSec = Math.floor(diff / 1000);
  if (totalSec === lastSeconds) return;
  lastSeconds = totalSec;

  const days    = Math.floor(totalSec / 86400);
  const hours   = Math.floor((totalSec % 86400) / 3600);
  const minutes = Math.floor((totalSec % 3600) / 60);
  const seconds = totalSec % 60;

  const dayDigits = days >= 100 ? 3 : 2;
  setDigits('dDays',    days,    dayDigits);
  setDigits('dHours',   hours,   2);
  setDigits('dMinutes', minutes, 2);
  setDigits('dSeconds', seconds, 2);
}

function showDone() {
  const card = document.getElementById('glassCard');
  const cd   = document.getElementById('countdown');
  cd.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px">
      <div class="done-msg">🎉&nbsp; Time&rsquo;s up!</div>
      <div class="done-sub">${escHtml(state.name)}</div>
    </div>`;
  // Burst particles
  const ring = document.createElement('div');
  ring.className = 'confetti-ring';
  const colors = ['#a78bfa','#60a5fa','#f472b6','#34d399','#fbbf24'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    const angle = (i / 28) * 360;
    const dist  = 60 + Math.random() * 80;
    s.style.cssText = `
      background:${colors[i % colors.length]};
      --tx:${Math.cos(angle * Math.PI/180) * dist}px;
      --ty:${Math.sin(angle * Math.PI/180) * dist}px;
      animation-delay:${Math.random()*0.3}s`;
    ring.appendChild(s);
  }
  card.appendChild(ring);
}

/* ── Target info label ── */
function updateLabel() {
  const info = document.getElementById('targetInfo');
  const name = document.getElementById('eventName');
  name.textContent = state.name;
  info.textContent = fmt(new Date(state.target));
}

/* ── Card tilt / parallax ── */
const card = document.getElementById('glassCard');
let tiltRAF = null;
card.addEventListener('mousemove', e => {
  cancelAnimationFrame(tiltRAF);
  tiltRAF = requestAnimationFrame(() => {
    const r = card.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  - 0.5) * 2;
    const y = ((e.clientY - r.top)  / r.height - 0.5) * 2;
    card.style.transform = `rotateY(${x * 5}deg) rotateX(${-y * 5}deg) translateZ(0)`;
  });
});
card.addEventListener('mouseleave', () => {
  cancelAnimationFrame(tiltRAF);
  card.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1)';
  card.style.transform  = '';
  setTimeout(() => { card.style.transition = ''; }, 620);
});

/* ── Modal ── */
const overlay    = document.getElementById('overlay');
const nameInput  = document.getElementById('nameInput');
const dateInput  = document.getElementById('dateInput');
const btnSave    = document.getElementById('btnSave');
const btnCancel  = document.getElementById('btnCancel');

function openModal() {
  nameInput.value = state.name;
  const d = new Date(state.target);
  // datetime-local value: YYYY-MM-DDTHH:MM
  const pad = n => String(n).padStart(2,'0');
  dateInput.value =
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` +
    `T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  overlay.classList.add('open');
  setTimeout(() => nameInput.focus(), 60);
}

function closeModal() {
  overlay.classList.remove('open');
}

function applySettings() {
  const name   = nameInput.value.trim() || DEFAULT_NAME;
  const dt     = new Date(dateInput.value);
  const target = isNaN(dt.getTime()) ? DEFAULT_TARGET : dt.getTime();
  state = { name, target };
  save(state);
  doneFired = false;
  lastSeconds = -1;
  // Reset drums
  Object.keys(drumState).forEach(k => {
    drumState[k].drums.forEach(d => d.innerHTML = '');
    drumState[k].prev = drumState[k].prev.map(() => -1);
  });
  // Restore countdown markup if was in done state
  const cd = document.getElementById('countdown');
  if (!cd.querySelector('.unit')) {
    cd.innerHTML = `
      <div class="unit"><div class="digits" id="dDays"></div><div class="unit-label">Days</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dHours"></div><div class="unit-label">Hours</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dMinutes"></div><div class="unit-label">Minutes</div></div>
      <div class="sep"><div class="sep-dot"></div><div class="sep-dot"></div></div>
      <div class="unit"><div class="digits" id="dSeconds"></div><div class="unit-label">Seconds</div></div>`;
    // Re-init drum state for new elements
    ['dDays','dHours','dMinutes','dSeconds'].forEach(id => delete drumState[id]);
  }
  // Remove confetti
  const ring = document.querySelector('.confetti-ring');
  if (ring) ring.remove();
  updateLabel();
  closeModal();
  tick();
}

document.getElementById('eventName').addEventListener('click', openModal);
document.getElementById('targetInfo').addEventListener('click', openModal);
document.getElementById('eventName').addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && openModal());
document.getElementById('targetInfo').addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && openModal());
btnSave.addEventListener('click', applySettings);
btnCancel.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── XSS helper ── */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ── Init ── */
updateLabel();
tick();
setInterval(tick, 200);
</script>
</body>
